<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>江川协同 · 超级分身 原型 v7</title>
<style>
:root{
  --bg:#f6f5f2; --pn:#fff; --ink:#1c2026; --ink2:#5b636e; --ink3:#8f959e; --line:#e6e3dd; --line2:#f0eee9; --fill:#f3f2ee;
  --acc:#4f46e5; --acc-bg:#eef0ff; --warn:#c2410c; --warn-bg:#fff3e8; --ok:#2f7d45; --ok-bg:#eaf7ee; --red:#e03131; --wait:#7048d8; --wait-bg:#f3effe;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13.5px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit}
small,.mut{color:var(--ink3);font-size:12px}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:8px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 12px;font-size:12.5px;white-space:nowrap;transition:.12s}
.btn:hover{border-color:#bbb6ac}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.sm{padding:2px 9px;font-size:12px;border-radius:6px}
.btn.lk{border:none;background:none;color:var(--acc);padding:2px 4px}
.tag{font-size:10.5px;border-radius:4px;padding:0 6px;line-height:18px;border:1px solid var(--line);color:var(--ink2);background:#fff;white-space:nowrap;display:inline-block}
.tag.ai{border-color:#d6d8fb;color:var(--acc);background:var(--acc-bg)}
.tag.warn{border-color:#f5cfb4;color:var(--warn);background:var(--warn-bg)}
.tag.ok{border-color:#c5e5ce;color:var(--ok);background:var(--ok-bg)}
.tag.wait{border-color:#dcd0fb;color:var(--wait);background:var(--wait-bg)}
.spin{width:11px;height:11px;border-radius:50%;border:2px solid var(--acc);border-top-color:transparent;animation:sp .8s linear infinite;display:inline-block;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes up{from{transform:translateY(5px);opacity:0}}
.av{width:30px;height:30px;border-radius:50%;background:#dfe3ea;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#3d4450;flex:none}
.av.sm{width:24px;height:24px;font-size:11px}
.av.g{border-radius:8px}
.av.ext{background:#fff;border:1px dashed #9aa}

/* 分身光球 */
.orb{width:22px;height:22px;border-radius:50%;flex:none;display:inline-block;background:radial-gradient(circle at 34% 30%,#fff 0,#dfe2ff 14%,#7c74f0 48%,#2c2475 100%);box-shadow:0 2px 8px rgba(79,70,229,.35)}
.orb.lg{width:76px;height:76px;box-shadow:0 0 0 10px rgba(99,102,241,.07),0 14px 40px rgba(79,70,229,.35);animation:br 4s ease-in-out infinite}
.orb.md{width:34px;height:34px}
.orb.xs{width:18px;height:18px}
.orb.busy{animation:pulse 1.4s ease-in-out infinite}
@keyframes br{50%{transform:scale(1.04);box-shadow:0 0 0 16px rgba(99,102,241,.05),0 14px 46px rgba(79,70,229,.42)}}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(99,102,241,.18),0 2px 8px rgba(79,70,229,.35)}}

/* 框架 */
.tb{height:46px;display:flex;align-items:center;gap:14px;padding:0 14px 0 16px;background:var(--pn);border-bottom:1px solid var(--line)}
.brand{font-weight:600;display:flex;align-items:center;gap:8px;width:220px}
.brand i{width:24px;height:24px;border-radius:7px;background:var(--ink);color:#fff;font-style:normal;font-size:12px;display:flex;align-items:center;justify-content:center}
.gs{margin:0 auto;width:440px;height:30px;border:1px solid var(--line);border-radius:15px;background:var(--fill);color:var(--ink3);display:flex;align-items:center;gap:8px;padding:0 14px;font-size:12.5px;cursor:pointer}
.uinfo{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);width:220px;justify-content:flex-end}
.body{display:flex;height:calc(100vh - 46px)}
.rail{width:72px;flex:none;background:var(--fill);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:3px}
.rail button{width:60px;border:none;background:none;border-radius:10px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:var(--ink2);position:relative}
.rail button:hover{background:#e9e7e1}
.rail button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.rail .ic{width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:17px;line-height:1}
.rail .bd{position:absolute;top:3px;right:8px;min-width:16px;height:16px;border-radius:8px;font-size:10px;line-height:16px;padding:0 4px;color:#fff;background:var(--red);font-weight:600}
.rail .bd.o{background:var(--warn)}.rail .bd.g{background:#8f959e}
.rail .rrun{position:absolute;top:4px;right:10px}
.rail hr{width:36px;border:none;border-top:1px solid var(--line);margin:4px 0}
.rail .sp{flex:1}
.page{flex:1;min-width:0;position:relative;overflow:hidden}

/* 输入框 */
.comp{border:1.5px solid var(--line);border-radius:16px;background:#fff;padding:10px 12px 8px;transition:.15s;box-shadow:0 2px 10px rgba(0,0,0,.03)}
.comp:focus-within{border-color:#a5a0f5;box-shadow:0 0 0 4px var(--acc-bg)}
.comp textarea{width:100%;border:none;outline:none;resize:none;height:46px;background:none;font-size:14px}
.comp .ct{display:flex;align-items:center;gap:8px}
.comp .opt{font-size:12px;border:1px solid var(--line);border-radius:12px;padding:1px 9px;color:var(--ink2);background:#fff;white-space:nowrap}
.comp .plus{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:#fff;padding:0;color:var(--ink2)}
.send{width:32px;height:32px;border-radius:50%;border:none;background:var(--ink);color:#fff;font-size:15px;flex:none}
.comp.sm{border-radius:12px;padding:8px 10px 6px}
.comp.sm textarea{height:38px;font-size:13px}
.comp.sm .send{width:28px;height:28px;font-size:13px}

/* ========== 首页：和分身的对话 ========== */
.home{height:100%;display:flex;flex-direction:column;background:radial-gradient(1200px 500px at 50% -10%,#eceaff 0,rgba(236,234,255,0) 60%),var(--bg)}
.hero{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;padding:9vh 20px 30px}
.hero h1{font-size:26px;font-weight:600;margin:22px 0 4px;letter-spacing:.3px}
.hero p{color:var(--ink2);margin:0 0 26px}
.hero .comp{width:min(720px,100%)}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:14px 0 0;max-width:760px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px 13px;font-size:12.5px;color:var(--ink2)}
.chips button:hover{border-color:#a5a0f5;color:var(--acc)}
.tcards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(720px,100%);margin-top:34px}
.tcard{border:1px solid var(--line);background:rgba(255,255,255,.8);border-radius:14px;padding:12px 14px;text-align:left;cursor:pointer;transition:.12s}
.tcard:hover{border-color:#bbb6ac;background:#fff}
.tcard .k{font-size:11.5px;color:var(--ink3);display:flex;align-items:center;gap:6px}
.tcard .v{font-size:13.5px;margin-top:4px}
.tcard .v b{color:var(--warn)}
.thread{flex:1;overflow:auto;padding:22px 20px 10px}
.tin{max-width:760px;margin:0 auto}
.thead{max-width:760px;margin:0 auto 10px;display:flex;align-items:center;gap:10px}
.dock{padding:8px 20px 18px}
.dock .comp{max-width:760px;margin:0 auto}
.dock .chips{margin:0 auto 8px;justify-content:flex-start}
.m{display:flex;gap:10px;margin-bottom:16px;animation:up .25s}
.m.me{justify-content:flex-end}
.m.me .bb{background:var(--ink);color:#fff;border-radius:14px 4px 14px 14px;padding:8px 13px;max-width:560px}
.m.ai .bb{max-width:620px;padding-top:2px}
.m.ai .w{font-size:11.5px;color:var(--ink3);margin-bottom:2px}
.quote{border-left:3px solid #c9c5bd;background:rgba(0,0,0,.035);padding:4px 10px;margin:2px 0 6px;font-size:12.5px;border-radius:0 6px 6px 0}
.m.me .quote{border-left-color:#888;background:rgba(255,255,255,.12)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.scard{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;margin-top:8px;cursor:pointer;max-width:460px;transition:.12s}
.scard:hover{border-color:#a5a0f5}
.scard b{display:block;font-size:13px;font-weight:600}
.brief{border:1px solid var(--line);background:#fff;border-radius:14px;margin-top:6px;overflow:hidden}
.brief .h{padding:10px 14px;border-bottom:1px solid var(--line2);font-weight:600}
.brief .r{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line2);font-size:13px}
.brief .r:last-child{border-bottom:none}
.brief .r.done .tx{color:var(--ink3);text-decoration:line-through}
.typing span{display:inline-block;width:5px;height:5px;border-radius:50%;background:#aaa;margin:0 1.5px;animation:ty 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes ty{50%{transform:translateY(-3px);opacity:.4}}

/* 分身小球（非首页常驻） */
.dot{position:absolute;right:22px;bottom:150px;z-index:30;border:none;background:none;padding:0;border-radius:50%}
.dot .orb{width:46px;height:46px}
.dot .tip{position:absolute;right:54px;top:50%;transform:translateY(-50%);background:var(--ink);color:#fff;font-size:12px;border-radius:8px;padding:3px 9px;white-space:nowrap;opacity:0;transition:.15s;pointer-events:none}
.dot:hover .tip{opacity:1}
.dot .bd{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;border-radius:9px;background:var(--warn);color:#fff;font-size:10px;line-height:17px;font-weight:600;padding:0 4px}
.dpop{position:absolute;right:22px;bottom:208px;width:380px;height:min(540px,calc(100% - 228px));z-index:31;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 60px rgba(20,20,50,.22);display:flex;flex-direction:column;overflow:hidden;animation:up .2s}
.dpop .hd{display:flex;align-items:center;gap:9px;padding:12px 14px;border-bottom:1px solid var(--line2)}
.dpop .ctx{margin:8px 14px 0;font-size:11.5px;color:var(--acc);background:var(--acc-bg);border-radius:10px;padding:2px 10px;align-self:flex-start;max-width:340px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dpop .ms{flex:1;overflow:auto;padding:12px 14px}
.dpop .m .bb{max-width:290px!important;font-size:13px}
.dpop .ft{padding:0 12px 12px}

/* ========== 工作台 ========== */
.ws{display:grid;grid-template-columns:268px minmax(0,1fr) 360px;height:100%}
.wl{border-right:1px solid var(--line);background:#faf9f6;display:flex;flex-direction:column;min-height:0}
.wl .sc{flex:1;overflow:auto;padding:12px 10px}
.sh{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink2);padding:8px 8px 4px}
.sh .c{margin-left:auto;font-weight:400;color:var(--ink3)}
.si{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:10px;padding:7px 10px;margin:1px 0}
.si:hover{background:#f0eee9}
.si.on{background:#fff;border-color:var(--line)}
.si .t{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.si .s{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--ink3)}
.si .s span:first-child{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl{border-radius:10px;margin:1px 0}
.pl .pr{display:flex;align-items:center;gap:9px;padding:7px 8px;cursor:pointer;border-radius:10px}
.pl .pr:hover{background:#f0eee9}
.pl .pi{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.pl .nm{font-size:13px;line-height:1.3}
.pl .nm small{display:block;font-size:11px}
.pl.off .nm,.pl.off .pi{opacity:.45}
.sw{width:30px;height:18px;border-radius:9px;background:#d4d1ca;border:none;position:relative;padding:0;flex:none;transition:.15s}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--ok)}.sw.on::after{left:14px}
.pd{padding:2px 10px 8px 43px;font-size:12px;color:var(--ink2)}
.pd div{padding:1px 0}
.pd b{font-weight:600;color:var(--ink3);font-size:11px;margin-right:4px}
.wm{display:flex;flex-direction:column;min-height:0;background:var(--pn)}
.wh{padding:14px 24px 12px;border-bottom:1px solid var(--line2)}
.wh h2{margin:0;font-size:17px}
.wh .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:12px}
.wt{flex:1;overflow:auto;padding:18px 24px}
.wt .tin{max-width:720px}
.run{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#fcfbf9;margin-top:4px}
.run .rh{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);margin-bottom:8px}
.step{display:flex;gap:10px;position:relative;padding-bottom:12px}
.step:last-child{padding-bottom:0}
.step:not(:last-child)::before{content:"";position:absolute;left:10px;top:22px;bottom:0;width:1.5px;background:var(--line)}
.step .ic{width:21px;height:21px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;position:relative;z-index:1}
.step.done .ic{background:var(--ok-bg);color:var(--ok)}
.step.run .ic{background:var(--acc-bg)}
.step.todo .ic{background:#fff;border:1.5px solid #d4d1ca}
.step.confirm .ic{background:var(--warn);color:#fff}
.step .sb{flex:1;min-width:0}
.step .st{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:13px}
.step.todo .st b{font-weight:400;color:var(--ink3)}
.step .tm{margin-left:auto;font-size:11px;color:var(--ink3)}
.step .sd{font-size:12.5px;color:var(--ink2);margin-top:1px}
.kd{font-size:10.5px;border-radius:4px;padding:0 5px;line-height:17px;background:var(--fill);color:var(--ink2);white-space:nowrap}
.k-conn{background:#e8f3f5;color:#0b7285}.k-expert{background:#f3effe;color:var(--wait)}.k-skill{background:var(--acc-bg);color:var(--acc)}.k-write{background:var(--ok-bg);color:var(--ok)}.k-wait,.k-im{background:var(--warn-bg);color:var(--warn)}
.achip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:8px;padding:4px 10px 4px 6px;margin-top:6px;background:#fff;cursor:pointer;font-size:12.5px}
.achip:hover{border-color:#a5a0f5}
.cp{margin-top:8px;border:1.5px solid #f1c7a6;background:linear-gradient(#fffaf5,#fff);border-radius:12px;padding:12px 14px;animation:up .3s}
.cp .q{font-weight:600}
.cp .why{font-size:12px;color:var(--ink2);margin:2px 0 8px}
.cp table{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:10px;background:#fff}
.cp th,.cp td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line2)}
.cp th{background:#faf9f6;color:var(--ink2);font-weight:600;font-size:12px}
.cp .fl{color:var(--warn)}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--ink2);padding:20px}
.wr{border-left:1px solid var(--line);background:#faf9f6;display:flex;flex-direction:column;min-height:0}
.wr .hd{padding:12px 14px 0}
.tabs{display:flex;gap:14px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink2)}
.tabs span{padding:6px 0;cursor:pointer}
.tabs span.on{color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--ink)}
.al{padding:10px 12px 4px;max-height:42%;overflow:auto}
.ai2{display:flex;gap:9px;align-items:center;padding:7px 9px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.ai2:hover{background:#f0eee9}
.ai2.on{background:#fff;border-color:var(--line)}
.ai2.new{animation:up .4s;border-color:var(--ok)}
.ext{width:28px;height:34px;border-radius:5px;border:1.5px solid #c9c5bd;font-size:8.5px;font-weight:700;display:flex;align-items:flex-end;justify-content:center;padding-bottom:3px;flex:none;color:var(--ink2);background:#fff}
.ext.XLS{border-color:#8dc29c;color:var(--ok)}.ext.DOC{border-color:#9db0ee;color:#3451d1}.ext.PDF{border-color:#e9a28a;color:var(--warn)}.ext.PPT{border-color:#f0b37e;color:#c2410c}.ext.MD{border-color:#a5a0f5;color:var(--acc)}
.ai2 .t{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv{flex:1;display:flex;flex-direction:column;min-height:0;border-top:1px solid var(--line);margin-top:6px}
.pv .ph2{display:flex;align-items:center;gap:6px;padding:10px 14px;flex-wrap:wrap}
.pv .box{flex:1;overflow:auto;margin:0 14px;border:1px solid var(--line);border-radius:10px;background:#eceae5;padding:12px}
.pv .box .paper{transform-origin:top left;zoom:.72}
.pv .note{font-size:11.5px;color:var(--ink3);padding:8px 14px 12px}

/* 产物渲染 */
.paper{background:#fff;border:1px solid #dcd9d2;border-radius:4px;padding:28px 36px;font-size:13px;line-height:1.8;max-width:680px;margin:0 auto}
.paper h1{font-size:20px;margin:0 0 8px}.paper h2{font-size:15px;margin:16px 0 4px}.paper h3{text-align:center;font-size:16px;margin:0 0 12px}
.paper p{margin:3px 0}
.paper blockquote{margin:6px 0 12px;border-left:3px solid #aaa;background:#f6f6f4;padding:4px 10px;color:var(--ink2);font-size:12px}
.paper table{border-collapse:collapse;font-size:12px;width:100%;margin:6px 0}
.paper td,.paper th{border:1px solid #ddd;padding:4px 8px;text-align:left}
.paper th{background:#f3f2ee}
.ph{display:block;height:9px;border-radius:3px;background:#ecebe7;margin:8px 0}
.xls{border-collapse:collapse;background:#fff;font-size:12.5px;margin:0 auto}
.xls th,.xls td{border:1px solid #dcd9d2;padding:5px 10px;text-align:left;white-space:nowrap}
.xls th{background:#f3f2ee;font-weight:600}
.xls .fl{background:#fff1e4}.xls .fx{background:#eaf7ee}
.slides{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:680px;margin:0 auto}
.slide{aspect-ratio:16/9;background:#fff;border:1px solid #ccc;border-radius:4px;padding:10px;font-size:12px;position:relative}
.slide i{position:absolute;right:8px;bottom:4px;font-size:10px;color:var(--ink3);font-style:normal}

/* ========== 事项（清单式） ========== */
.tk{display:grid;grid-template-columns:232px minmax(0,1fr) 380px;height:100%}
.tl{border-right:1px solid var(--line);background:#faf9f6;overflow:auto;padding:12px 10px}
.li{display:flex;align-items:center;gap:9px;width:100%;border:none;background:none;border-radius:8px;padding:6px 10px;text-align:left;font-size:13px}
.li:hover{background:#f0eee9}
.li.on{background:#e9e7ff;color:var(--acc);font-weight:600}
.li .i{width:18px;text-align:center;flex:none}
.li .c{margin-left:auto;font-size:11.5px;color:var(--ink3);font-weight:400}
.tm2{display:flex;flex-direction:column;min-height:0;background:#fff}
.tm2 .hd{padding:16px 26px 10px;display:flex;align-items:center;gap:10px}
.tm2 .hd h2{margin:0;font-size:18px}
.qa{margin:0 26px 8px;display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:10px;padding:7px 12px;background:var(--fill)}
.qa:focus-within{border-color:#a5a0f5;background:#fff}
.qa input{flex:1;border:none;outline:none;background:none}
.tls{flex:1;overflow:auto;padding:0 26px 30px}
.gh{font-size:12px;font-weight:600;color:var(--ink2);padding:12px 0 4px;display:flex;gap:6px}
.gh.r{color:var(--red)}
.tr{display:flex;align-items:center;gap:10px;padding:8px 8px;border-bottom:1px solid var(--line2);border-radius:6px;cursor:pointer;animation:up .25s}
.tr:hover{background:#faf9f6}
.tr.on{background:#f3f2ff}

const SMART = [['today','今天', t => !t.done && t.d != null && t.d <= 16],['next','接下来 7 天', t => !t.done && t.d != null && t.d > 16 && t.d <= 23],['all','全部', t => !t.done],['done','已完成', t => t.done]];
function listFilter(){ const sm = SMART.find(x => x[0] === S.tlist); return sm ? sm[2] : (t => !t.done && t.list === S.tlist); }
function listName(){ const sm = SMART.find(x => x[0] === S.tlist); return sm ? sm[1] : S.tlist; }
const srcIco = s => !s ? '' : ({ im:'💬', note:'✎', ws:'⌘', fs:'◉', me:'' })[s.t] || '';
function tStat(t){
  if (t.done) return null;
  if (t.looks) return ['ok','看起来办完了'];
  const ss = SESS.filter(x => x.from?.id === t.id || x.id === t.fs);
  if (ss.some(x => x.status === 'confirm')) return ['warn','等你确认'];
  if (ss.some(x => x.status === 'running' || x.status === 'wait' || x.status === 'plan')) return ['ai','分身在办'];
  if (t.wait) return ['wait','在等' + t.wait];
  return null;
}
function calHtml(){
  // 2026 年 11 月：11-01 是周日；d>30 表示 12 月
  const cells = []; for (let k = 0; k < 35; k++){ const d = k - 5; cells.push(d); }
  const items = d => { const out = []; TASKS.forEach(t => { if (t.d === d) out.push([t, null]); (t.sub || []).forEach(x => { if (x.d === d) out.push([t, x]); }); }); return out; };
  return `<div class="cal">${'一二三四五六日'.split('').map(w => `<div class="dh">周${w}</div>`).join('')}${cells.map(d => { const o = d < 1 || d > 30; const dd = o ? (d < 1 ? 31 + d : d - 30) : d; return `<div class="dc ${o ? 'o' : ''} ${d === 16 ? 't' : ''}"><span class="n">${dd}</span>${items(d).map(([t, x]) => `<span class="ce ${x ? 's' : ''} ${(x ? x.done : t.done) ? 'd' : ''} ${!t.done && d < 16 ? 'r' : ''}" data-a="tsel" data-x="${t.id}">${x ? '↳ ' + esc(x.t) : esc(t.title)}</span>`).join('')}</div>`; }).join('')}</div>`;
}

/* ====================== 引擎：工作台执行 ====================== */
function runSess(s){
  if (s.stopped) return;
  if (s.status === 'plan') return;
  const i = s.steps.findIndex(x => x.s !== 'done');
  if (i < 0){
    s.status = 'done'; s.time = '今天 ' + now();
    if (s.end) s.tail.push({ r:'ai', h:s.end.h, acts:s.end.acts, tm:now() });
    if (!s.waySaved && s.steps.length > 3){ s.waySaved = 1; WAYS.unshift({ id:uid('w'), t:s.title.replace(/ ·.*$/, '') + '的做法', sc:s.title, st:s.steps.map(z => z.t.replace(/：.*$/, '')).slice(0, 4).join(' → '), auto:1 }); }
    if (s.goal && !s.goalAsked){ s.goalAsked = 1; s.status = 'wait'; s.tail.push({ r:'ai', tm:now(), h:`我认为目标已经达成：${esc(s.goal.std || s.goal.g)}。要结束这个目标吗？`, acts:[['确认达成','goalOk', s.id],['继续推进','goalMore', s.id]] }); notify(s, 'done'); render(); return; }
    if ((s.queue || []).length){ const q = s.queue.splice(0); q.forEach(t => s.tail.push({ r:'ai', tm:now(), h:`处理排队的要求：「${esc(t)}」。已按这个调整。` })); }
    if (s.onDone) s.onDone();
    notify(s, 'done'); render(); return;
  }
  const st = s.steps[i];
  if (st.k === 'confirm'){ st.s = 'confirm'; s.status = 'confirm'; notify(s, 'confirm'); render(); return; }
  if (st.k === 'wait'){ st.s = 'wait'; s.status = 'wait'; st.sent = st.sent || []; render(); return; }
  if (s.goal && st.k === 'write' && !st.rep){ st.rep = 1; s.tail.push({ r:'ai', tm:now(), h:'阶段汇报：资料和依据已备齐，开始生成。' }); }
  st.s = 'run'; s.status = 'running'; render();
  setTimeout(() => {
    if (s.stopped) return;
    st.s = 'done'; st.tm = now();
    if (st.done) st.d = st.done;
    if (st.art){ ARTS[st.art] = ARTS[st.art] || { name:st.artName, type:st.artType, kind:st.artKind }; Object.assign(ARTS[st.art], { sess:s.id, time:'今天 ' + now() }); if (!s.arts.includes(st.art)) s.arts.push(st.art); S.newArt = st.art; S.artSel = st.art; }
    (st.drafts || []).forEach(d => { S.drafts[d.chat] = Object.assign({ sess:s.id }, d); S.inp['im-' + d.chat] = ''; });
    runSess(s);
  }, st.ms || 1500);
}

  bindNo(){ S.bindSug = null; toast('没有绑定。会话收不到回复，会停在「等回复」'); render(); },
  dropDraft(x){ delete S.drafts[x]; S.inp['im-' + x] = ''; render(); },
  saveFile(x){ const f = fileById(x); f.folder = 'kb-ys'; f.from = '从聊天保存'; toast(`已保存到个人知识库「预算资料」，正在向量化`, ['查看', 'file:' + x]); },
  giveFs(x){
    const [c, m] = msgOf(x);
    S.dot = true; S.home.push({ r:'me', h:`<div class="quote">${esc(m.f)} · ${esc(c.n)} · ${m.t}<br>${esc(m.x)}</div>交给你看看` });
    S.typing = true; render();
    setTimeout(() => {
      S.typing = false;
      if (x === 'm-liuy') S.home.push({ r:'ai', tm:now(), h:'测试报告是二期方案的前置。晚两天的话，方案 v0.4 也要顺延，但离 11-27 定稿还有余量。建议：', acts:[['确认顺延到 11-18，并起草提醒','extendLiuy'],['开会话评估对上线的影响','assessLiuy'],['先不动','noop']] });
      else if (x === 'm-lina') S.home.push({ r:'ai', tm:now(), h:'李娜要的需求测算表，工作台里正在汇总，停在确认点等你判断。要我：', acts:[['去确认点','go','ws:ys'],['先起草一句回复','draftLina']] });
      else if (x === 'm-wk') S.home.push({ r:'ai', tm:now(), h:'这是外部人员要的培训排期，12-01 截止。要开一个会话起草排期吗？', acts:[['开会话起草排期','wsFromMsg','培训排期草案（给华信）'],['建成事项','msgTask', x]] });
      else S.home.push({ r:'ai', tm:now(), h:'收到。要我：', acts:[['建成事项','msgTask', x],['开会话办','wsFromMsg', m.x.slice(0, 16)]] });
      render();
    }, 800);
  },
  extendLiuy(){ task('t4').d = 18; S.drafts['g-xt2'] = { chat:'g-xt2', text:'@刘洋 测试报告期限顺延到 18 号，环境还没恢复的话先给我已测部分。', why:'依据：你刚才的决定' }; S.inp['im-g-xt2'] = ''; S.home.push({ r:'ai', tm:now(), h:'按你的确认，事项期限改到 11-18。给刘洋的话放进了项目组群的输入框，由你本人发送。', acts:[['去发送','go','im:g-xt2']] }); render(); },
  assessLiuy(){ const s = newSess('测试报告延期对二期上线的影响', '刘洋说测试报告晚两天，评估对 11-27 定稿和 12-08 上线的影响', { ctx:'刘洋 · 项目组群 · 测试报告晚两天', ws:'w-2q' }); S.home.push({ r:'ai', tm:now(), h:'好，在工作区「二期上线」开了会话评估。', cards:[{ sess:s.id }] }); render(); },
  wsFromMsg(x){ const s = newSess(x, x); S.home.push({ r:'ai', tm:now(), h:`好，在工作区「${esc(wsp(s.ws).name)}」开了会话。`, cards:[{ sess:s.id }] }); render(); },
  mselOn(x){ S.msel = { on:true, chat:S.chat, ids:[x] }; render(); },
  mselOff(){ S.msel = { on:false, ids:[] }; render(); },
  mselTog(x){ const i = S.msel.ids.indexOf(x); if (i < 0) S.msel.ids.push(x); else S.msel.ids.splice(i, 1); render(); },
  mHelp(){
    const c = chat(S.chat), ms = S.msel.ids.map(i => c.msgs.find(m => m.id === i)), who = [...new Set(ms.filter(m => !m.me).map(m => m.f))];
    const txt = c.id === 'g-xt2' && who.includes('刘洋') ? `@刘洋 测试报告可以顺延到 18 号，环境恢复前先把已测部分发我。${who.includes('周敏') ? '@周敏 法务意见出来后第一时间同步我，合同盖章版华信周五寄到。' : ''}` : `收到，${who.join('、') || '大家'}提到的${ms.length > 1 ? '这几件事' : '这件事'}我都记下了，今天内逐一回复。`;
    S.drafts[c.id] = { chat:c.id, text:txt, why:`依据：选中的 ${ms.length} 条消息，合成一条回复` }; S.inp['im-' + c.id] = ''; S.msel = { on:false, ids:[] }; render();
  },
  mTask(){
    const c = chat(S.chat), ms = S.msel.ids.map(i => c.msgs.find(m => m.id === i)), who = [...new Set(ms.filter(m => !m.me).map(m => m.f))];
    S.mPick = { c:c.id, ms };
    if (who.length > 1){
      $('#mask').innerHTML = `<div class="dlg" data-stop><div class="hd"><span class="orb xs"></span><b class="grow">这几条消息像是 ${who.length} 件事</b></div><div class="bd2">${ms.map(m => `<div class="quote">${esc(m.f || '我')}：${esc(m.x || '[文件]')}</div>`).join('')}<p class="mut">合成一个事项：几条消息都放进它的上下文。分别建成：每人一件，你勾选后确认。</p></div><div class="ft2"><button class="btn" data-a="mTaskSplit">分别建成 ${who.length} 个</button><button class="btn pri" data-a="mTaskOne">合成一个事项</button></div></div>`;
      $('#mask').classList.add('on');
    } else A.mTaskOne();
  },
  mTaskOne(){ const { c, ms } = S.mPick, ch = chat(c); S.msel = { on:false, ids:[] }; preDlg({ kind:'task', title:`跟进：${(ms.find(m => m.x) || {}).x?.slice(0, 18) || ch.n}`, d:18, list:/二期|测试|合同/.test(ms.map(m => m.x).join('')) ? '二期上线' : '收件箱', src:{ t:'im', id:c, l:`${ch.n} · ${ms.length} 条消息` }, bind:c, ctx:ms.map(m => `${m.f || '我'}：${m.x || '[文件]'}`).join('\n'), ctxItems:ms.map(m => ['消息', `${m.f || '我'}：${(m.x || '[文件]').slice(0, 40)}`]) }); },
  mTaskSplit(){
    const { c, ms } = S.mPick, ch = chat(c); S.msel = { on:false, ids:[] };
    S.dbItems = ms.filter(m => !m.me).map(m => [`${m.f}：${(m.x || '').slice(0, 20)}`, 18, m, c]);
    $('#mask').innerHTML = `<div class="dlg" data-stop><div class="hd"><span class="orb xs"></span><b class="grow">分别建成事项</b><small>勾选你要建的</small></div><div class="bd2">${S.dbItems.map(([t, d], k) => `<label class="chk"><input type="checkbox" id="dbi-${k}" checked><span class="grow">${esc(t)}</span><small>${dlabel(d)}</small></label>`).join('')}</div><div class="ft2"><button class="btn" data-a="closeMask">取消</button><button class="btn pri" data-a="mSplitOk">确认建成</button></div></div>`;
  },
  mSplitOk(){ let n = 0; S.dbItems.forEach(([t, d, m, c], k) => { if ($('#dbi-' + k)?.checked){ n++; TASKS.push({ id:uid('t'), title:t, d, list:'二期上线', p:1, src:{ t:'im', id:c, l:`${m.f} · ${chat(c).n}` }, ctx:[['消息', `${m.f}：${m.x}`]], bind:[c] }); } }); A.closeMask(); toast(`已建成 ${n} 个事项`, ['查看', 'tasks:二期上线']); render(); },
  mAddTo(){ const c = chat(S.chat), ms = S.msel.ids.map(i => c.msgs.find(m => m.id === i)); addToDlg(ms.map(m => `${m.f || '我'}：${m.x || '[文件]'}`).join('\n'), '消息', ms.map(m => ['消息', `${m.f || '我'}：${(m.x || '[文件]').slice(0, 40)}`])); },
  mNote(){ const c = chat(S.chat), ms = S.msel.ids.map(i => c.msgs.find(m => m.id === i)); const n = { id:uid('n'), title:`${c.n} · ${ms.length} 条消息`, body:ms.map(m => `${m.f || '我'}：${m.x || '[文件]'}`).join('\n'), time:'今天 ' + now(), src:'来自聊天' }; NOTES.unshift(n); S.msel = { on:false, ids:[] }; toast('已记到笔记', ['查看', 'note:' + n.id]); render(); },
  mGive(){ const c = chat(S.chat), ms = S.msel.ids.map(i => c.msgs.find(m => m.id === i)); S.msel = { on:false, ids:[] }; S.dot = true; S.home.push({ r:'me', h:`<div class="quote">${ms.map(m => `${esc(m.f || '我')} · ${m.t}：${esc(m.x || '[文件]')}`).join('<br>')}</div>交给你看看（${esc(c.n)}，${ms.length} 条）` }); S.typing = true; render(); setTimeout(() => { S.typing = false; S.home.push({ r:'ai', tm:now(), h:`这 ${ms.length} 条里有两件要跟的事：测试报告要晚两天，合同在法务审。要我：`, acts:[['建成事项','go','im:' + c.id],['开会话评估对上线的影响','assessLiuy']] }); render(); }, 800); },
  msgTask(x){ const [c, m] = msgOf(x); const t = parseTask(m.x); preDlg({ kind:'task', title:`${m.f}：${m.x.slice(0, 22)}`, d:t.d || 18, list:t.list, src:{ t:'im', id:c.id, l:`${m.f} · ${c.n}` }, bind:c.id, ctx:`${m.f}：${m.x}`, ctxItems:[['消息', `${m.f}：${m.x}`]] }); },
  msgAddTo(x){ const [c, m] = msgOf(x); addToDlg(`${m.f}：${m.x}`, '消息'); },
  msgNote(x){ const [c, m] = msgOf(x); const n = { id:uid('n'), title:`${m.f} · ${c.n}`, body:m.x, time:'今天 ' + now(), src:'来自聊天' }; NOTES.unshift(n); toast('已记到笔记', ['查看', 'note:' + n.id]); },
  draftReply(x){ if (x === 'c-lina') draftLina(); else S.drafts[x] = { chat:x, text:'收到，我这边跟进，周四前给你答复。', why:'依据：你的事项' }; S.inp['im-' + x] = ''; render(); },

  /* 笔记 */
  nsel(x){ S.nsel = x; render(); },
  newNote(){ const n = { id:uid('n'), title:'', body:'', time:'今天 ' + now(), src:'记一条' }; NOTES.unshift(n); S.nsel = n.id; render(); setTimeout(() => $('#nb-' + n.id)?.focus(), 30); },
  noteTidy(){ const n = note(S.nsel); S.nsug = n.id === 'n1' ? { id:n.id, sum:'华信盖章合同周五寄到；顺带问周敏法务意见是否有改动。', todo:'确认收到合同盖章版，并问周敏法务意见', d:20 } : { id:n.id, sum:n.body.replace(/\n/g, ' ').slice(0, 40) + '…', todo:'跟进：' + (n.title || n.body.slice(0, 10)), d:18 }; render(); },
  nsugAdd(){ const n = note(S.nsug.id); S.nsug.added = true; preDlg({ kind:'task', title:S.nsug.todo, d:S.nsug.d, list:'二期上线', src:{ t:'note', id:n.id, l:'笔记 · ' + n.title }, ctx:n.body, ctxItems:[['笔记', n.title]] }); },
  nsugOff(){ S.nsug = null; render(); },
  noteTask(){ const n = note(S.nsel); const t = parseTask(n.body.split('\n')[0]); preDlg({ kind:'task', title:n.title || t.title, d:t.d || 18, list:t.list, src:{ t:'note', id:n.id, l:'笔记 · ' + (n.title || '') }, ctx:n.body, ctxItems:[['笔记', n.title || '']] }); },
  noteAddTo(){ const n = note(S.nsel); addToDlg(n.title + '：' + n.body.split('\n')[0], '笔记'); },
  noteWs(){ const n = note(S.nsel); const s = newSess('根据笔记：' + (n.title || '无标题'), '根据这条笔记办：' + n.body, { ctx:'笔记 · ' + n.title }); go('ws:' + s.id); },

  /* 资料库 */
  folder(x){ S.folder = x; S.fsel = null; render(); },
  fsel(x){ S.fsel = x; render(); },
  autoVec(x){ KBAUTO[x] = !KBAUTO[x]; toast(KBAUTO[x] ? '已开启：之后放进这个文件夹的文件会自动向量化' : '已关闭自动向量化（已有文件不受影响）'); render(); },
  vecTog(x){ const f = fileById(x); if (f.vec === 'y'){ f.vec = 'n'; toast('已取消向量化：原文还在，分身检索不到它了'); render(); } else { f.vec = 'r'; render(); setTimeout(() => { f.vec = 'y'; toast('向量化完成，分身办事时可以检索到它'); render(); }, 1800); } },
  upload(){ if (S.folder.startsWith('w-') || S.folder === 'kb-all'){ /* ok */ } const f = { id:uid('f'), name:'新上传的文件.pdf', type:'PDF', folder:S.folder === 'kb-all' ? 'kb-zd' : S.folder, from:'上传', time:'今天', kind:'doc', vec:(S.folder.startsWith('w-') || KBAUTO[S.folder] || S.folder === 'kb-all') ? 'r' : 'n' }; FILES.unshift(f); S.fsel = f.id; render(); if (f.vec === 'r') setTimeout(() => { f.vec = 'y'; render(); }, 1800); },
  fileFs(x){ const f = fileById(x); S.dot = true; render(); S.inp['dot-in'] = ''; setTimeout(() => { const e = $('#dot-in'); if (e){ e.value = `看一下《${f.name}》，`; S.inp['dot-in'] = e.value; e.focus(); } }, 30); },
  fileTask(x){ const f = fileById(x); preDlg({ kind:'task', title:'跟进：' + f.name.replace(/\.\w+$/, ''), d:18, list:'收件箱', src:{ t:'me', l:'文件 · ' + f.name }, ctx:f.name, ctxItems:[['文件', f.name]] }); },
  fileAddTo(x){ addToDlg(fileById(x).name, '文件'); },

  /* 设置 */
  setTab(x){ S.setTab = x; render(); },
  memTab(x){ S.memTab = x; render(); },
  memDel(x){ const [g, i] = x.split(':'); ({ fact:FACTS, way:WAYS, rule:RULES })[g].splice(+i, 1); toast('已删除，分身之后不会再用它'); render(); },
  memWrong(x){ const n = prompt('哪里不对？分身会按你的说法纠正', ''); if (n){ const i = +x.split(':')[1]; FACTS[i].t = n; FACTS[i].src += ' · 你已纠正'; render(); } },
  ruleTog(x){ const r = RULES.find(z => z.id === x); if (r.lock) return; r.on = !r.on; render(); },
};

/* ====================== 提示 ====================== */
let tt;
function toast(m, act){
  const t = $('#toast'); t.innerHTML = esc(m) + (act ? `<button data-a="go" data-x="${act[1]}">${act[0]}</button>` : '');
  t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 4200);
}
function renderGuide(){
  const g = $('#guide');
  if (!S.guide || S.page !== 'home' || S.home.length){ g.className = 'guide min'; g.innerHTML = '演示路线 ▸'; g.dataset.a = 'guideOn'; return; }
  g.className = 'guide'; delete g.dataset.a;
  g.innerHTML = `<button class="x" data-a="guideOff">—</button><b>演示路线</b><ol>
    <li>事项：点「回复李娜」，补一段背景，再「带上下文交给贾维斯办」</li><li>消息：项目组群里悬停消息点「多选」，选两条试「帮我回」「建成事项」</li><li>首页点「今天有什么要处理的」→「去确认」</li>
    <li>工作台：看右侧「计划」「上下文」；展开「已执行 n 步」点依据</li>
    <li>确认点选「先问这两个科室」，可勾选「以后都这样处理」</li>
    <li>去消息发出张伟、孙婷的草稿并「绑定」，回工作台看续跑和 v2，点「对比」</li>
    <li>工作台左下：插件、自动化、轻应用（打开示例应用）</li>
    <li>新会话把模式切到「先出计划」或「按目标推进」试试</li>
    <li>首页右上「分身记得的」：事实、做法、规则</li></ol>`;
}
A.guideOff = () => { S.guide = false; renderGuide(); };
A.guideOn = () => { S.guide = true; if (S.page !== 'home' || S.home.length){ S.page = 'home'; S.home = []; render(); } else renderGuide(); };

/* ====================== 事件 ====================== */
document.addEventListener('click', e => {
  if (e.target.id === 'mask') return A.closeMask();
  const el = e.target.closest('[data-a]');
  if (S.dot && !e.target.closest('.dpop') && !e.target.closest('.dot') && !(el && /^(giveFs|fileFs)$/.test(el.dataset.a))){ S.dot = false; if (!el) return render(); }
  if (!el) return;
  e.preventDefault(); e.stopPropagation();
  const f = A[el.dataset.a]; if (f) f(el.dataset.x, el.dataset.y);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset && el.dataset.a2 === 'modeSel'){ const k = el.dataset.x; if (k === 'new') S.newMode = el.value; else sess(k).mode = el.value; render(); } if (el.dataset && el.dataset.a2 === 'verSel'){ S.artSel = el.value; render(); }
  if (el.id === 'new-wsp') S.newWsp = el.value;
});
document.addEventListener('input', e => {
  const el = e.target; if (el.dataset.keep === undefined) return;
  S.inp[el.id] = el.value;
  if (el.id.startsWith('nt-')) note(el.id.slice(3)).title = el.value;
  if (el.id.startsWith('nb-')) note(el.id.slice(3)).body = el.value;
  if (el.id.startsWith('tt-')) task(el.id.slice(3)).title = el.value;
});
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'j'){ e.preventDefault(); if (S.page === 'home') $('#home-in')?.focus(); else A.dot(); return; }
  if (e.key === 'Escape'){ A.closeMask(); if (S.dot){ S.dot = false; render(); } return; }
  const el = e.target;
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && el.dataset && el.dataset.enter){ e.preventDefault(); S.inp[el.id] = el.value; A[el.dataset.enter](); }
});

render();
setTimeout(() => runSess(sess('db')), 1500);
</script>
</body>
